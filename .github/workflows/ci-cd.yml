# .github/workflows/ci-cd.yml
name: CI-CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
- run: flutter analyze --no-fatal-infos
- run: flutter test
      - run: flutter build web

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: flutter build web
      - uses: actions/upload-artifact@v4
        with: { name: web-staging, path: build/web }

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production   # pausa até você aprovar
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: flutter build web
      - run: echo "Publicar no GitHub Pages / release aqui"
